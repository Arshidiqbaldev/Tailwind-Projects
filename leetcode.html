<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Nav</title>
</head>

<body class="w-full bg-zinc-950 font-custom text-zinc-100 text-base">

    <main class=" flex flex-col md:flex-row  p-4  w-full min-h-screen justify-between  gap-4 ">
        <div
            class="content flex flex-col gap-4 items-center justify-center p-4 w-full grow  border border-zinc-800 rounded-4xl">


            <div class="flex w-full flex-col gap-10 bg-zinc-900 border border-zinc-500/10 max-w-150 p-4 rounded-3xl">



                <div class="data-div flex flex-col gap-4">
                    <h1 class="w-full text-3xl capitalize text-orange-500">user data</h1>
                    <input type="text" placeholder="put username"
                        class="input-field p-3 border border-zinc-500/10 rounded-3xl outline-0 placeholder:text-zinc-700 placeholder:capitalize focus:border  focus:border-zinc-600 active:border active:border-zinc-600"
                        id="username">
                    <button id="search" class="bg-orange-500 p-3 rounded-3xl cursor-pointer ">Search</button>
                </div>


                <div
                    class="progress-parent flex flex-col md:flex-row *:aspect-square *:flex *:overflow-hidden   *:p-1 *:w-full md:*:w-1/3 gap-2 *:rounded-full">

                    <div id="easydiv" class="progress-div easy-parent bg-blue-500">

                        <div
                            class="easy-progress w-full flex flex-col items-center justify-center bg-zinc-900 rounded-full">
                            <span id="easy" class="easy text-2xl text-orange-400"></span>
                            <span class="tag">Easy</span>
                        </div>

                    </div>


                    <div id="mediumdiv" class="progress-div  medium-parent bg-orange-500">

                        <div
                            class="medium-progress w-full flex flex-col items-center justify-center bg-zinc-900 rounded-full">
                            <span id="medium" class="medium text-2xl text-orange-500"></span>
                            <span class="tag">Medium</span>
                        </div>

                    </div>


                    <div id="harddiv" class="progress-div  hard-parent bg-red-500">

                        <div
                            class="hard-progress w-full flex flex-col items-center justify-center bg-zinc-900 rounded-full">
                            <span id="hard" class="hard text-2xl text-orange-600"></span>
                            <span class="tag">Hard</span>
                        </div>

                    </div>



                </div>


                <div class="cards-parent">

                </div>

            </div>






        </div>

    </main>




    <script type="module" src="/src/main.js"></script>
    

    <script type="module" src="/src/leetscript.js">
    </script>

</body>

</html>
